# Checks the scripts on every push; on a tag (v1.2.3) packs them as homeboard-server.tar.gz with SHA256SUMS and
# publishes a GitHub release. The install steps in README.md download "latest", so a new tag is all an update takes.
name: Scripts en release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax en shellcheck
        run: |
          bash -n *.sh
          shellcheck -x -S warning *.sh
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pakket en controlegetal
        run: |
          tar --owner=0 --group=0 --mtime='2026-01-01' -czf homeboard-server.tar.gz docker-compose.yml install.sh onderhoud.sh lib.sh README.md
          sha256sum homeboard-server.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" homeboard-server.tar.gz SHA256SUMS -t "Home Board-server $GITHUB_REF_NAME" \
            --notes "Installeren volgens README.md. Het pakket wordt eerst gecontroleerd met sha256sum -c SHA256SUMS."
